[project]
name = "egypt-lead-scraper"
version = "0.1.0"
description = "Local lead scraper for Egyptian businesses via Google Maps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.12",
    "playwright>=1.49.0",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
    "pydantic-settings>=2.6.0",
    "phonenumbers>=8.13.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "structlog>=24.4.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0.0",
    "rapidfuzz>=3.0.0",
]

[project.scripts]
egypt-leads = "app.desktop:main"
egypt-leads-server = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
